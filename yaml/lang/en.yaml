TRACKER_ENHANCEMENTS.setting.reflow.label: Enable initiative reflow
TRACKER_ENHANCEMENTS.setting.reflow.description: If initiatives are tied, renumber the encounter in the requested order using consecutive integers. This replaces decimal tie breakers.
TRACKER_ENHANCEMENTS.setting.showHpForType.label: Player HP circle visibility
TRACKER_ENHANCEMENTS.setting.showHPForType.description: World setting, shared by all players. Configure under your own GM account. All combatants shows every valid HP circle in the tracker. Actor-type choices add that type to normal token visibility; Bar Brawl visibility rules still apply.
TRACKER_ENHANCEMENTS.setting.showHpForType.tokenVisibility: Use token visibility
TRACKER_ENHANCEMENTS.setting.showHpForType.all: All combatants
TRACKER_ENHANCEMENTS.setting.showHpForType.actorType: Actor type
TRACKER_ENHANCEMENTS.setting.enableHpField.label: Enable health fields
TRACKER_ENHANCEMENTS.setting.enableHpField.description: Show one HP field per combatant, plus Temp HP in D&D 6. Owners and GMs can edit; friendly observed actors show read-only values. Unowned enemies have no numeric health fields.
TRACKER_ENHANCEMENTS.setting.enableHpRadial.label: Enable HP radial bar
TRACKER_ENHANCEMENTS.setting.enableHpRadial.description: Enables HP circles on combat tracker portraits. In D&D 6, the left half is HP and the right half is Temp HP; both fill bottom to top against the modified HP maximum. Players follow Player HP circle visibility and token Bar 1 visibility. Bar Brawl visibility rules still apply.
TRACKER_ENHANCEMENTS.setting.removeTargets.label: Enable target removal every turn
TRACKER_ENHANCEMENTS.setting.removeTargets.description: Clear your targets when the active encounter changes turn or round, or ends. Applies immediately without reloading.
TRACKER_ENHANCEMENTS.setting.hideNonAllyInitiative.label: Hide non-ally initiative
TRACKER_ENHANCEMENTS.setting.hideNonAllyInitiative.description: Hide non-ally initiative from players on FVTT combat tracker
TRACKER_ENHANCEMENTS.hp.label: HP
TRACKER_ENHANCEMENTS.temp.label: Temp
TRACKER_ENHANCEMENTS.hp.help: '20: set HP; +3: heal 3 HP; -5: deal 5 damage, using Temp first.'
TRACKER_ENHANCEMENTS.temp.help: '20: set Temp; +3: add 3 Temp; -5: deal 5 damage, using Temp first and then HP.'
TRACKER_ENHANCEMENTS.resource.help: Enter a number to set this resource, or a signed change such as -5 or +3.
TRACKER_ENHANCEMENTS.invalidDndHp: Enter a whole number or a signed change such as -10 or +3.

TRACKER_ENHANCEMENTS.invalidHp: Enter a number or a signed change such as -10 or +3.
TRACKER_ENHANCEMENTS.updateFailed: The update failed. Check permissions and the browser console for details.
TRACKER_ENHANCEMENTS.rollInitiativeFirst: Roll or enter initiative for all combatants before reordering.
TRACKER_ENHANCEMENTS.initiativeReflowRequired: These initiatives are tied. Enable initiative reflow to place a combatant between them.
TRACKER_ENHANCEMENTS.unsupportedTurnOrder: This system uses a custom turn order that cannot be rearranged by initiative.
TRACKER_ENHANCEMENTS.groupInitiative: Change this group's shared initiative using the system's group controls.
TRACKER_ENHANCEMENTS.migrationFailed: Some previous settings could not be copied. Review Tracker Enhancements settings; details are in the browser console. The original settings have been kept.
